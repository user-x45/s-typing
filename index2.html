const VS="attribute vec2 p;uniform vec4 r;uniform vec2 res;varying vec2 uv,lp;void main(){vec2 q=r.xy+p*r.zw;uv=p;lp=p*r.zw;gl_Position=vec4(q.x/res.x*2.-1.,1.-q.y/res.y*2.,0.,1.);}";
const FS="precision mediump float;varying vec2 uv,lp;uniform vec4 col,col2,col3;uniform vec2 sz;uniform float rad,mode,t,a,px;uniform sampler2D tex;"+
"void main(){if(mode==1.){gl_FragColor=texture2D(tex,uv)*a;return;}"+
"if(mode==2.){vec3 c=mix(col.rgb,col2.rgb,uv.y);for(int i=0;i<5;i++){float f=float(i);vec2 o=vec2(.5+.45*sin(t*.15+f*1.9),.5+.45*cos(t*.12+f*2.7));float d=length((uv-o)*vec2(sz.x/sz.y,1.));c=mix(c,col3.rgb,smoothstep(.32,0.,d)*.1);}gl_FragColor=vec4(c,1.);return;}"+
"vec2 h=sz*.5;vec2 d=abs(lp-h)-h+rad;float s=length(max(d,0.))+min(max(d.x,d.y),0.)-rad;float al=clamp(.5-s*px,0.,1.)*a;gl_FragColor=vec4(col.rgb*al,al);}";

const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.uniform1i(u.tex,0);

let W=0,H=0,S=1,VW=0,VH=0,DPR=1,mx=-1,my=-1,hits=[],cur=false,clipR=null,inUse=false;
function resize(){

const CC={},col=h=>CC[h]||(CC[h]=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255));
function rect(x,y,w,h,r,c,a=1){

}
function clip(x,y,w,h){

}

const tc=document.createElement("canvas"),tx=tc.getContext("2d"),cache=new Map(),wrapC={};
const font=(size,wt,mono)=>`${wt} ${size}px ${mono?'"SFMono-Regular",Consolas,Menlo,monospace':'"M PLUS Rounded 1c","Hiragino Kaku Gothic ProN",Meiryo,sans-serif'}`;
function clearCache(){cache.forEach(e=>gl.deleteTexture(e.t));cache.clear()}
function tex(s,size,c,wt,mono){
  const sc=Math.ceil(DPR*S*4)/4,k=`${s}|${size}|${c}|${wt}|${mono}|${sc}`;
  let e=cache.get(k);if(e)return e;
  tx.setTransform(1,0,0,1,0,0);tx.font=font(size,wt,mono);
  const w=Math.ceil(tx.measureText(s).width)+4,h=Math.ceil(size*1.5);
  tc.width=Math.max(1,Math.ceil(w*sc));tc.height=Math.max(1,Math.ceil(h*sc));
  tx.setTransform(sc,0,0,sc,0,0);tx.font=font(size,wt,mono);tx.fillStyle=c;tx.textBaseline="middle";tx.fillText(s,2,h/2);
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

}
function text(s,x,y,size,c,al="center",wt=700,a=1,mono=0){
  if(!s)return 0;
  const e=tex(s,size,c,wt,mono),lx=(al==="center"?x-e.w/2:al==="right"?x-e.w:x)-2;
  gl.bindTexture(gl.TEXTURE_2D,e.t);gl.uniform1f(u.mode,1);gl.uniform4f(u.r,lx,y-e.h/2,e.w,e.h);gl.uniform1f(u.a,a);

}
function fit(s,size,mw,wt=700,mono=0){tx.setTransform(1,0,0,1,0,0);tx.font=font(size,wt,mono);const w=tx.measureText(s).width;return w>mw?size*mw/w:size}
function wrap(s,size,mw,wt=500){
  const k=s+"|"+size+"|"+mw+"|"+wt;if(wrapC[k])return wrapC[k];
  tx.setTransform(1,0,0,1,0,0);tx.font=font(size,wt,0);
  const out=[];let ln="";
  for(const ch of s){if(tx.measureText(ln+ch).width>mw&&ln){out.push(ln);ln=ch}else ln+=ch}
  out.push(ln);return wrapC[k]=out;
}

play(now){

  if(left<=0&&!ended){
    if(isOn){if(!sentFin){sentFin=true;if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"finished",score,miss}))}}
    else endSolo();
  }
  if(scene!=="play")return;
  const cw=Math.min(VW-32,760),cx=VW/2,x0=cx-cw/2,warn=left<=10,rt=inputMode==="realtime";
  const pw=Math.min(150,(cw-90)/2.2),myT=isOn?`${nm()} ${score} もん`:`せいかい ${score} もん`;
  rect(x0,18,pw,34,12,P.teal,.14);

  text(`残り ${left} 秒`,tx0+pw/2,35,15,P.red,"center",800);
  if(!isOn)btn(x0+cw-68,18,68,34,"終了",P.red,"#ffffff",quit,13,12);
  rect(x0,66,cw,6,3,P.ink,.1);
  const fr=Math.max(0,Math.min(1,(endAt-now)/1e5));
  if(fr>0)rect(x0,66,cw*fr,6,3,warn?P.red:P.teal);
  const cy=96,ch=TOUCH?190:210,sa=now-shake,dx=sa<300?Math.sin(sa*.05)*6*(1-sa/300):0;

  gl.uniform2f(u.res,VW,VH);gl.uniform1f(u.px,S);
  bg(now);scenes[scene](now);unclip();
  if(now<toastUntil){
    const sz=fit(toastMsg,14,VW-60),w=Math.min(VW-32,sz*toastMsg.length*1.05+40);
    rect((VW-w)/2,VH-64,w,38,19,P.ink,.92);text(toastMsg,VW/2,VH-45,sz,P.bg);
  }
  if(!inUse&&tin.style.display!=="none"){tin.style.display="none";if(document.activeElement===tin)tin.blur()}
  cv.style.cursor=cur?"pointer":"default";
}
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,moved:0};mx=e.clientX/S;my=e.clientY/S});
cv.addEventListener("pointermove",e=>{
  mx=e.clientX/S;my=e.clientY/S;
  if(drag&&e.buttons){
    const dy=e.clientY-drag.y;drag.moved+=Math.abs(dy)+Math.abs(e.clientX-drag.x);drag.x=e.clientX;drag.y=e.clientY;
    if(scene==="info"||scene==="records"){sc.y-=dy/S;clampScroll()}
  }
});
cv.addEventListener("pointerleave",()=>{mx=my=-1});
addEventListener("wheel",e=>{if(scene==="info"||scene==="records"){sc.y+=e.deltaY/S;clampScroll()}},{passive:true});
cv.addEventListener("click",e=>{
  if(drag&&drag.moved>8)return;
  mx=e.clientX/S;my=e.clientY/S;
  for(let i=hits.length-1;i>=0;i--){
    const[x,y,w,h,fn,c]=hits[i];
    if(c&&(my<c[0]||my>c[1]))continue;
    if(mx>=x&&mx<=x+w&&my>=y&&my<=y+h){sfx("click");fn();return}
  }
});
addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(scene==="play"){
    if(e.key==="Escape"&&!isOn){quit();return}
    if(inputMode==="realtime"&&/^[a-zA-Z-]$/.test(e.key)){e.preventDefault();key(e.key.toLowerCase())}
  }else if(scene==="fjoin"){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();if(code.length<6)code+=e.key}
    else if(e.key==="Backspace"){e.preventDefault();code=code.slice(0,-1)}
    else if(e.key==="Enter")friendJoin();
  }
});
addEventListener("keyup",()=>{pressed=pressed&&performance.now()-pressed.at<150?pressed:null});
tin.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.keyCode===229)return;
  e.preventDefault();
  if(scene==="name")confirmName();else submitText();
});
tin.addEventListener("keydown",e=>{if(scene==="play"&&e.key.length===1)sfx("key")});
tin.addEventListener("beforeinput",e=>{if(/^insertFrom(Paste|Drop|Yank)$/.test(e.inputType))e.preventDefault()});
tin.addEventListener("input",()=>{if(scene==="play")hint=hintDefault()});
function drain(){
  const v=cap.value;cap.value="";
  for(const raw of v){
    if(scene==="play"){const c=raw==="ー"||raw==="－"?"-":raw;if(/^[a-zA-Z-]$/.test(c))key(c.toLowerCase())}
    else if(scene==="fjoin"&&/^[0-9]$/.test(raw)&&code.length<6)code+=raw;
  }
}
cap.addEventListener("compositionstart",()=>{comp=true});
cap.addEventListener("compositionend",()=>{comp=false;drain()});
cap.addEventListener("input",e=>{if(!comp&&!e.isComposing)drain()});
addEventListener("hashchange",()=>{if(inFlow())quit();applyHash()});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="hidden")return;
  if(scene==="search"||scene==="fcreate"||scene==="fwait")cancel();
  else if(scene==="count"){cdFn=null;clearTimeout(0);if(ws){ws.close();ws=null}scene="menu"}
  else if(scene==="play"&&isOn){
    if(ws&&ws.readyState===1)ws.close();
    finishOnline({you:{score,miss},opponent:{score:oppScore,miss:0},result:"lose",forfeit:true});
  }
});

let psock=null,pretry=0,ptimer=null,plast="",penabled=false;
function presenceState(){
  let activity="idle";
  if(scene==="play")activity=isOn?(friend?"friend":"online"):"solo";
  else if(scene==="count")activity=ws?(friend?"friend":"online"):"solo";
  else if(["search","fcreate","fwait","fjoin"].includes(scene))activity="matching";
  const on=activity!=="idle";
  return{type:"state",page:"main",activity,mode:on?mode:"",level:on?level:"",name:nm()};
}
function syncPresence(){
  if(!psock||psock.readyState!==1)return;
  const p=JSON.stringify(presenceState());
  if(p===plast)return;
  plast=p;psock.send(p);
}
function schedulePresence(){
  clearTimeout(ptimer);
  if(document.visibilityState==="hidden")return;
  const d=Math.min(6e4,1000*2**pretry)+Math.floor(Math.random()*1000);
  pretry++;ptimer=setTimeout(connectPresence,d);
}
function connectPresence(){
  if(!penabled||document.visibilityState==="hidden")return;
  if(psock&&psock.readyState<=1)return;
  let s;
  try{s=new WebSocket(`${SERVER}/presence`)}catch(e){schedulePresence();return}
  psock=s;
  s.onopen=()=>{pretry=0;plast="";syncPresence()};
  s.onclose=()=>{if(psock===s)psock=null;plast="";schedulePresence()};
}
function disconnectPresence(){
  clearTimeout(ptimer);const s=psock;psock=null;plast="";
  if(s){s.onclose=null;try{s.close(1000,"hidden")}catch(e){}}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){if(!isOn)disconnectPresence()}
  else{pretry=0;connectPresence()}
});
["pointerdown","keydown","scroll","touchstart"].forEach(t=>addEventListener(t,()=>{if(penabled)return;penabled=true;connectPresence()},{once:true,passive:true}));
setInterval(syncPresence,1000);
setInterval(()=>{if(psock&&psock.readyState===1)psock.send("ping")},30000);

if(document.fonts&&document.fonts.load)document.fonts.load('700 20px "M PLUS Rounded 1c"').then(clearCache);
applyHash();
requestAnimationFrame(frame);
(async()=>{
  const rankP=loadRank();
  const words=Promise.all(MODES.flatMap(([m])=>LEVELS.map(([l])=>ensureWords(m,l))));
  let handled=await processGoogle();
  if(!handled)handled=await processRedirect();
  const sessionP=logged?Promise.resolve():verifySession();
  await Promise.all([rankP,words,sessionP]).catch(()=>{});
  if(scene==="load")scene="menu";
})();
</script>
