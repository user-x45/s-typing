<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理者ページ｜シンプルタイピング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

  :root{
    --washi:#faf8f4;
    --washi-deep:#f0ece2;
    --ink:#2b2a2e;
    --ink-soft:#7a7680;
    --hanko:#e0563f;
    --hanko-deep:#c4432e;
    --gold:#dba52a;
    --line:#e5e0d5;
    --panel-bg:#ffffff;
    --panel-bg-soft:#f3efe6;
    --input-bg:#ffffff;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --washi:#1b1a1d;
      --washi-deep:#232226;
      --ink:#f0eee9;
      --ink-soft:#a29d97;
      --hanko:#e8724f;
      --hanko-deep:#f28762;
      --gold:#e0b545;
      --line:#333136;
      --panel-bg:#232226;
      --panel-bg-soft:#2b2a2e;
      --input-bg:#232226;
    }
  }

  *{box-sizing:border-box;}

  button, input, select, textarea{
    font-family: inherit;
  }

  html{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--washi);
    color:var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Meiryo, "メイリオ", sans-serif;
    line-height:1.5;
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }

  .stage{
    width:100%;
    max-width:920px;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }

  .kicker{
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--gold);
    margin-bottom:6px;
  }

  h1{
    font-weight:800;
    font-size:30px;
    margin:0;
    letter-spacing:0.06em;
  }

  .panel{
    background:var(--panel-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px;
  }

  .login-panel{
    max-width:360px;
    margin:0 auto;
  }

  .field-label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  input[type="password"]{
    width:100%;
    padding:12px 14px;
    background:var(--input-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    color:var(--ink);
    outline:none;
  }

  input[type="password"]:focus{
    border-color:var(--gold);
  }

  .login-btn{
    width:100%;
    margin-top:16px;
    padding:12px;
    background:var(--hanko);
    color:var(--washi);
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }

  .login-btn:hover{
    background:var(--hanko-deep);
  }

  .login-btn:disabled{
    opacity:0.6;
    cursor:default;
  }

  .error-text{
    color:var(--hanko);
    font-size:13px;
    margin-top:10px;
    min-height:1em;
  }

  .hidden{display:none !important;}

  .loading-panel{
    max-width:360px;
    margin:0 auto;
    text-align:center;
  }

  .loading-text{
    font-size:15px;
    color:var(--ink-soft);
  }

  .spinner{
    width:32px;
    height:32px;
    margin:0 auto 16px;
    border:3px solid var(--line);
    border-top-color:var(--hanko);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .menu-panel{
    max-width:420px;
    margin:0 auto;
  }

  .menu-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .menu-btn{
    width:100%;
    padding:18px;
    background:var(--panel-bg-soft);
    border:1.5px solid var(--line);
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }

  .menu-btn:hover{
    border-color:var(--hanko);
    color:var(--hanko);
  }

  .logout-btn{
    width:100%;
    margin-top:6px;
    padding:12px;
    background:transparent;
    border:1.5px solid var(--hanko);
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    color:var(--hanko);
    cursor:pointer;
    text-align:center;
  }

  .logout-btn:hover{
    background:var(--hanko);
    color:var(--washi);
  }

  .board-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
  }

  .board{
    background:var(--panel-bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }

  .board-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  .board-title{
    font-weight:700;
    font-size:15px;
  }

  .clear-btn{
    background:transparent;
    border:1px solid var(--hanko);
    color:var(--hanko);
    border-radius:10px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
  }

  .clear-btn:hover{
    background:var(--hanko);
    color:var(--washi);
  }

  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 4px;
    border-bottom:1px solid rgba(0,0,0,0.06);
    font-size:13px;
  }

  .score-row:last-child{
    border-bottom:none;
  }

  .score-rank{
    font-weight:700;
    color:var(--hanko);
    width:40px;
  }

  .score-name{
    flex:1;
    padding-right:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .score-value{
    flex:1;
    font-weight:600;
  }

  .delete-btn{
    background:transparent;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:12px;
    padding:2px 6px;
  }

  .delete-btn:hover{
    color:var(--hanko);
  }

  .empty-text{
    font-size:13px;
    color:var(--ink-soft);
    opacity:0.7;
    padding:6px 4px;
  }

  .period-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }

  .period-tab{
    background:transparent;
    border:1.5px solid var(--ink-soft);
    color:var(--ink-soft);
    border-radius:10px;
    padding:7px 18px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  .period-tab.active{
    background:var(--hanko);
    border-color:var(--hanko);
    color:#fff;
  }

  .top-actions{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
  }

  .refresh-btn, .back-btn{
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    border-radius:10px;
    padding:8px 18px;
    font-size:13px;
    cursor:pointer;
  }

  .refresh-btn:hover, .back-btn:hover{
    background:var(--ink);
    color:var(--washi);
  }

  .user-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .user-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
  }

  .user-info{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .user-name{
    font-weight:700;
    font-size:14px;
  }

  .user-sub{
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.7;
    word-break:break-all;
  }

  .user-scores{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .user-delete-btn{
    background:transparent;
    border:1px solid var(--hanko);
    color:var(--hanko);
    border-radius:10px;
    padding:6px 14px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }

  .user-delete-btn:hover{
    background:var(--hanko);
    color:var(--washi);
  }

  .event-status{
    font-size:14px;
    font-weight:700;
    margin-bottom:18px;
  }

  input[type="month"]{
    width:100%;
    padding:12px 14px;
    background:var(--input-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    color:var(--ink);
    outline:none;
    margin-bottom:14px;
  }

  input[type="month"]:focus{
    border-color:var(--gold);
  }

  #event-notice-input{
    width:100%;
    padding:12px 14px;
    background:var(--input-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    margin-bottom:14px;
    resize:vertical;
  }

  #event-notice-input:focus{
    border-color:var(--gold);
  }

  .event-combo-checks{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:14px;
  }

  .event-combo-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px 12px;
    background:var(--input-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
  }

  .event-combo-row-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }

  .event-combo-row-checks{
    display:flex;
    gap:16px;
  }

  .event-combo-row-checks label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink);
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:12px;
    margin-bottom:16px;
  }

  .stat-card{
    background:var(--panel-bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    text-align:center;
  }

  .stat-value{
    font-size:32px;
    font-weight:800;
    color:var(--hanko);
    line-height:1.2;
  }

  .stat-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  .live-status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .live-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--ink-soft);
    opacity:0.6;
  }

  .live-status.connected .live-dot{
    background:#3fa66b;
    opacity:1;
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(63,166,107,0.5); }
    50%{ box-shadow:0 0 0 6px rgba(63,166,107,0); }
  }

  .presence-count{
    font-weight:700;
    font-size:14px;
    min-width:28px;
    text-align:right;
  }

  .presence-count.zero{
    opacity:0.4;
  }

  .presence-mode-grid{
    margin-bottom:16px;
  }

  .presence-name-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .presence-badge{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }

  .presence-badge.playing{
    background:var(--hanko);
    border-color:var(--hanko);
    color:var(--washi);
  }

  .presence-badge.matching{
    border-color:var(--gold);
    color:var(--gold);
  }

  .presence-badge.event-page{
    background:var(--gold);
    border-color:var(--gold);
    color:#3a2a00;
  }

  .presence-row-event{
    border-color:var(--gold);
  }

  .presence-badge.school-page{
    background:#2f9e94;
    border-color:#2f9e94;
    color:#0b3a34;
  }

  .presence-row-school{
    border-color:#2f9e94;
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="kicker">SIMPLE TYPING</div>
    <h1>管理者ページ</h1>
  </header>

  <div class="panel login-panel" id="login-panel">
    <button class="login-btn" id="login-btn">パスキーでログイン</button>
    <div class="error-text" id="login-error"></div>
    <div class="hidden" id="setup-area">
      <label class="field-label" for="setup-input">セットアップコード</label>
      <input type="password" id="setup-input" autocomplete="off">
      <button class="login-btn" id="setup-btn">パスキーを登録</button>
      <div class="error-text" id="setup-error"></div>
    </div>
  </div>

  <div class="panel loading-panel hidden" id="loading-panel">
    <div class="spinner"></div>
    <div class="loading-text">読み込み中...</div>
  </div>

  <div class="panel menu-panel hidden" id="menu-panel">
    <div class="menu-grid">
      <button class="menu-btn" id="menu-ranking-btn">ランキング管理</button>
      <button class="menu-btn" id="menu-users-btn">ユーザー管理</button>
      <button class="menu-btn" id="menu-invite-btn">招待コード管理</button>
      <button class="menu-btn" id="menu-playlog-btn">プレイログ</button>
      <button class="menu-btn" id="menu-presence-btn">リアルタイム状況</button>
      <button class="menu-btn" id="menu-event-btn">イベントモード</button>
      <button class="menu-btn" id="menu-passkey-btn">パスキー管理</button>
      <button class="logout-btn" id="logout-btn">ログアウト</button>
    </div>
  </div>

  <div id="ranking-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="ranking-back-btn">戻る</button>
      <button class="refresh-btn" id="refresh-btn">再読み込み</button>
    </div>
    <div class="period-tabs" id="period-tabs">
      <button type="button" class="period-tab active" data-period="total">全期間</button>
      <button type="button" class="period-tab" data-period="month">今月（月初〜）</button>
      <button type="button" class="period-tab" data-period="week">今週（日曜〜）</button>
    </div>
    <div class="board-grid" id="board-grid"></div>
  </div>

  <div id="user-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="user-back-btn">戻る</button>
      <button class="refresh-btn" id="user-refresh-btn">再読み込み</button>
    </div>
    <div class="user-list" id="user-list"></div>
  </div>

  <div id="invite-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="invite-back-btn">戻る</button>
      <button class="refresh-btn" id="invite-refresh-btn">再読み込み</button>
    </div>
    <div class="user-list" id="invite-list"></div>
  </div>

  <div id="passkey-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="passkey-back-btn">戻る</button>
      <div>
        <button class="clear-btn" id="passkey-add-btn">パスキーを追加</button>
        <button class="refresh-btn" id="passkey-refresh-btn">再読み込み</button>
      </div>
    </div>
    <div class="user-list" id="passkey-list"></div>
  </div>

  <div id="playlog-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="playlog-back-btn">戻る</button>
      <div>
        <button class="clear-btn" id="playlog-clear-btn">全削除</button>
        <button class="refresh-btn" id="playlog-refresh-btn">再読み込み</button>
      </div>
    </div>
    <div class="user-list" id="playlog-list"></div>
  </div>

  <div id="presence-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="presence-back-btn">戻る</button>
      <div class="live-status" id="presence-status">
        <span class="live-dot"></span>
        <span id="presence-status-text">接続中...</span>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value" id="presence-total">0</div><div class="stat-label">サイトを開いている人数</div></div>
      <div class="stat-card"><div class="stat-value" id="presence-playing">0</div><div class="stat-label">プレイ中</div></div>
      <div class="stat-card"><div class="stat-value" id="presence-matching">0</div><div class="stat-label">対戦相手を待機中</div></div>
      <div class="stat-card"><div class="stat-value" id="presence-idle">0</div><div class="stat-label">メニュー画面</div></div>
    </div>
    <div class="board-grid presence-mode-grid" id="presence-mode-grid"></div>
    <div class="user-list" id="presence-list"></div>
  </div>

  <div id="event-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="event-back-btn">戻る</button>
      <button class="refresh-btn" id="event-refresh-btn">再読み込み</button>
    </div>
    <div class="panel">
      <label class="field-label">イベントモード状態</label>
      <div class="event-status" id="event-status-text">読み込み中...</div>
      <label class="field-label" for="event-month-input">対象月</label>
      <input type="month" id="event-month-input">
      <label class="field-label">対象タイピングモード・難易度</label>
      <div class="event-combo-checks" id="event-combo-checks"></div>
      <label class="field-label" for="event-notice-input">お知らせ（イベント有効中にサイト上部へ表示）</label>
      <textarea id="event-notice-input" maxlength="200" rows="3" placeholder="空欄の場合はお知らせを表示しません"></textarea>
      <button class="login-btn" id="event-enable-btn">この月でイベントモードを有効化</button>
      <button class="logout-btn" id="event-disable-btn">無効化</button>
    </div>
    <div class="panel" style="margin-top:16px;">
      <label class="field-label">月別ランキングの確認</label>
      <input type="month" id="event-archive-month-input">
      <button class="login-btn" id="event-archive-load-btn">月別ランキングを表示</button>
      <div class="board-grid" id="event-archive-grid" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://key-onl.user-x45.workers.dev";
const MODE_LABELS = { hiragana: "ひらがな", katakana: "カタカナ", sentence: "文章" };
const LEVEL_LABELS = { beginner: "初級", intermediate: "中級", advanced: "上級" };
const MATCH_TYPE_LABELS = { solo: "一人プレイ", online: "オンライン対戦", friend: "フレンド対戦" };
const PERIOD_LABELS = { total: "全期間", month: "今月", week: "今週" };
let rankingPeriod = "total";
const MODES = ["hiragana", "katakana", "sentence"];
const LEVELS = ["beginner", "intermediate", "advanced"];

let adminToken = "";
let currentCredentialId = "";

const loginPanelEl = document.getElementById("login-panel");
const loadingPanelEl = document.getElementById("loading-panel");
const menuPanelEl = document.getElementById("menu-panel");
const rankingDashboardEl = document.getElementById("ranking-dashboard");
const userDashboardEl = document.getElementById("user-dashboard");
const inviteDashboardEl = document.getElementById("invite-dashboard");
const playlogDashboardEl = document.getElementById("playlog-dashboard");
const passkeyDashboardEl = document.getElementById("passkey-dashboard");
const passkeyListEl = document.getElementById("passkey-list");
const passkeyBackBtnEl = document.getElementById("passkey-back-btn");
const passkeyAddBtnEl = document.getElementById("passkey-add-btn");
const passkeyRefreshBtnEl = document.getElementById("passkey-refresh-btn");
const setupAreaEl = document.getElementById("setup-area");
const setupInputEl = document.getElementById("setup-input");
const setupBtnEl = document.getElementById("setup-btn");
const setupErrorEl = document.getElementById("setup-error");
const menuPasskeyBtnEl = document.getElementById("menu-passkey-btn");
const loginBtnEl = document.getElementById("login-btn");
const loginErrorEl = document.getElementById("login-error");
const refreshBtnEl = document.getElementById("refresh-btn");
const boardGridEl = document.getElementById("board-grid");
const userListEl = document.getElementById("user-list");
const inviteListEl = document.getElementById("invite-list");
const menuRankingBtnEl = document.getElementById("menu-ranking-btn");
const menuUsersBtnEl = document.getElementById("menu-users-btn");
const menuInviteBtnEl = document.getElementById("menu-invite-btn");
const logoutBtnEl = document.getElementById("logout-btn");
const rankingBackBtnEl = document.getElementById("ranking-back-btn");
const userBackBtnEl = document.getElementById("user-back-btn");
const userRefreshBtnEl = document.getElementById("user-refresh-btn");
const inviteBackBtnEl = document.getElementById("invite-back-btn");
const inviteRefreshBtnEl = document.getElementById("invite-refresh-btn");
const menuPlaylogBtnEl = document.getElementById("menu-playlog-btn");
const playlogListEl = document.getElementById("playlog-list");
const playlogBackBtnEl = document.getElementById("playlog-back-btn");
const playlogRefreshBtnEl = document.getElementById("playlog-refresh-btn");
const playlogClearBtnEl = document.getElementById("playlog-clear-btn");
const eventDashboardEl = document.getElementById("event-dashboard");
const presenceDashboardEl = document.getElementById("presence-dashboard");
const menuPresenceBtnEl = document.getElementById("menu-presence-btn");
const presenceBackBtnEl = document.getElementById("presence-back-btn");

function showOnly(el){
  if(el !== presenceDashboardEl) stopPresenceStream();
  [loginPanelEl, loadingPanelEl, menuPanelEl, rankingDashboardEl, userDashboardEl, inviteDashboardEl, playlogDashboardEl, eventDashboardEl, passkeyDashboardEl, presenceDashboardEl].forEach(node => {
    if(node === el){
      node.classList.remove("hidden");
    } else {
      node.classList.add("hidden");
    }
  });
}

async function callAdmin(action, extra){
  const res = await fetch(`${WORKER_URL}/admin`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: adminToken, action, ...extra })
  });
  if(res.status === 401){
    throw new Error("unauthorized");
  }
  return res.json();
}

function b64urlToBuffer(str){
  const s = String(str).replace(/-/g, "+").replace(/_/g, "/");
  const padded = s + "=".repeat((4 - (s.length % 4)) % 4);
  const bin = atob(padded);
  const out = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++){
    out[i] = bin.charCodeAt(i);
  }
  return out.buffer;
}

function bufferToB64url(buf){
  const arr = new Uint8Array(buf);
  let bin = "";
  for(let i = 0; i < arr.length; i++){
    bin += String.fromCharCode(arr[i]);
  }
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function postAdmin(payload){
  const res = await fetch(`${WORKER_URL}/admin`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  let data = {};
  try{
    data = await res.json();
  }catch(e){
    data = {};
  }
  if(res.status === 429){
    const err = new Error("locked");
    err.retryAfterSeconds = data.retryAfterSeconds;
    throw err;
  }
  if(res.status === 401){
    throw new Error("unauthorized");
  }
  if(!res.ok){
    throw new Error(data.error || "error");
  }
  return data;
}

async function login(){
  const options = await postAdmin({ action: "authOptions" });
  if(!options.hasCredentials){
    throw new Error("no_credentials");
  }
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge: b64urlToBuffer(options.challenge),
      rpId: options.rpId,
      allowCredentials: options.allowCredentials.map(id => ({ type: "public-key", id: b64urlToBuffer(id) })),
      userVerification: "required",
      timeout: 60000
    }
  });
  const data = await postAdmin({
    action: "login",
    credential: {
      id: assertion.id,
      response: {
        clientDataJSON: bufferToB64url(assertion.response.clientDataJSON),
        authenticatorData: bufferToB64url(assertion.response.authenticatorData),
        signature: bufferToB64url(assertion.response.signature)
      }
    }
  });
  currentCredentialId = assertion.id;
  return data.token;
}

async function registerPasskey(auth){
  const options = await postAdmin({ action: "registerOptions", ...auth });
  const pk = options.publicKey;
  const created = await navigator.credentials.create({
    publicKey: {
      challenge: b64urlToBuffer(pk.challenge),
      rp: pk.rp,
      user: { id: b64urlToBuffer(pk.user.id), name: pk.user.name, displayName: pk.user.displayName },
      pubKeyCredParams: pk.pubKeyCredParams,
      authenticatorSelection: pk.authenticatorSelection,
      excludeCredentials: pk.excludeCredentials.map(c => ({ type: "public-key", id: b64urlToBuffer(c.id) })),
      attestation: pk.attestation,
      timeout: pk.timeout
    }
  });
  const result = await postAdmin({
    action: "register",
    ...auth,
    credential: {
      id: created.id,
      response: {
        clientDataJSON: bufferToB64url(created.response.clientDataJSON),
        attestationObject: bufferToB64url(created.response.attestationObject)
      }
    }
  });
  return { ...result, credentialId: created.id };
}

function passkeyErrorMessage(e){
  if(e.message === "locked"){
    const minutes = Math.ceil(e.retryAfterSeconds / 60);
    return `試行回数が多すぎます。${minutes}分後にもう一度お試しください`;
  }
  if(e.name === "NotAllowedError" || e.name === "AbortError"){
    return "パスキーの操作がキャンセルされました";
  }
  if(e.name === "InvalidStateError"){
    return "このパスキーはすでに登録されています";
  }
  if(e.message === "unauthorized"){
    return "認証に失敗しました";
  }
  if(e.message === "passkey_not_configured"){
    return "サーバーのパスキー設定が未完了です";
  }
  return "エラーが発生しました。もう一度お試しください";
}

function renderBoards(data, period){
  boardGridEl.innerHTML = "";
  for(const mode of MODES){
    for(const level of LEVELS){
      const key = `${mode}:${level}`;
      const scores = data[key] || [];
      const board = document.createElement("div");
      board.className = "board";

      const head = document.createElement("div");
      head.className = "board-head";

      const title = document.createElement("div");
      title.className = "board-title";
      title.textContent = `${MODE_LABELS[mode]}・${LEVEL_LABELS[level]}`;

      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-btn";
      clearBtn.textContent = "全削除";
      clearBtn.addEventListener("click", async () => {
        if(!confirm(`${MODE_LABELS[mode]}・${LEVEL_LABELS[level]} の${PERIOD_LABELS[period]}ランキングを全て削除しますか？`)) return;
        showOnly(loadingPanelEl);
        try{
          await callAdmin("clear", { mode, level, period });
          await loadRankingDashboard();
        }catch(e){
          handleSessionExpired();
        }
      });

      head.appendChild(title);
      head.appendChild(clearBtn);
      board.appendChild(head);

      if(scores.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty-text";
        empty.textContent = "データがありません";
        board.appendChild(empty);
      } else {
        scores.forEach((entry, i) => {
          const scoreValue = typeof entry === "object" && entry !== null ? entry.score : entry;
          const scoreName = typeof entry === "object" && entry !== null && entry.name ? entry.name : "GUEST";

          const row = document.createElement("div");
          row.className = "score-row";

          const rank = document.createElement("div");
          rank.className = "score-rank";
          rank.textContent = `${i + 1}位`;

          const name = document.createElement("div");
          name.className = "score-name";
          name.textContent = scoreName;

          const value = document.createElement("div");
          value.className = "score-value";
          value.textContent = scoreValue;

          const del = document.createElement("button");
          del.className = "delete-btn";
          del.textContent = "削除";
          del.addEventListener("click", async () => {
            if(!confirm(`${scoreName}（${scoreValue}）を削除しますか？`)) return;
            showOnly(loadingPanelEl);
            try{
              await callAdmin("delete", { mode, level, score: scoreValue, period });
              await loadRankingDashboard();
            }catch(e){
              handleSessionExpired();
            }
          });

          row.appendChild(rank);
          row.appendChild(name);
          row.appendChild(value);
          row.appendChild(del);
          board.appendChild(row);
        });
      }

      boardGridEl.appendChild(board);
    }
  }
}

function buildEventComboChecks(){
  eventModeChecksEl.innerHTML = "";
  MODES.forEach(mode => {
    const row = document.createElement("div");
    row.className = "event-combo-row";

    const title = document.createElement("div");
    title.className = "event-combo-row-title";
    title.textContent = MODE_LABELS[mode];
    row.appendChild(title);

    const checks = document.createElement("div");
    checks.className = "event-combo-row-checks";
    LEVELS.forEach(level => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = `${mode}:${level}`;
      input.checked = true;
      label.appendChild(input);
      label.appendChild(document.createTextNode(` ${LEVEL_LABELS[level]}`));
      checks.appendChild(label);
    });
    row.appendChild(checks);

    eventModeChecksEl.appendChild(row);
  });
}

function getSelectedEventCombos(){
  return Array.from(eventModeChecksEl.querySelectorAll("input[type=checkbox]:checked")).map(el => el.value);
}

function setSelectedEventCombos(combos){
  const allCombos = MODES.flatMap(mode => LEVELS.map(level => `${mode}:${level}`));
  const list = Array.isArray(combos) && combos.length > 0 ? combos : allCombos;
  eventModeChecksEl.querySelectorAll("input[type=checkbox]").forEach(el => {
    el.checked = list.includes(el.value);
  });
}

buildEventComboChecks();

async function loadEventDashboard(){
  showOnly(loadingPanelEl);
  try{
    const data = await callAdmin("getEventMode", {});
    const allCombos = MODES.flatMap(mode => LEVELS.map(level => `${mode}:${level}`));
    const activeCombos = data.combos && data.combos.length > 0 ? data.combos : allCombos;
    const comboLabels = activeCombos.map(c => {
      const [mode, level] = c.split(":");
      return `${MODE_LABELS[mode]}・${LEVEL_LABELS[level]}`;
    }).join("、");
    eventStatusTextEl.textContent = data.enabled
      ? `イベントモード: 有効中（対象月: ${data.month || "未設定"} / 対象: ${comboLabels}）`
      : "イベントモード: 無効";
    eventMonthInputEl.value = data.month || "";
    eventNoticeInputEl.value = data.notice || "";
    setSelectedEventCombos(data.combos);
    eventArchiveGridEl.innerHTML = "";
    showOnly(eventDashboardEl);
  }catch(e){
    handleSessionExpired();
  }
}

function handleSessionExpired(){
  adminToken = "";
  showOnly(loginPanelEl);
  loginErrorEl.textContent = "セッションが切れました。もう一度パスキーでログインしてください";
}

async function tryLogin(){
  loginErrorEl.textContent = "";
  if(!window.PublicKeyCredential){
    loginErrorEl.textContent = "このブラウザはパスキーに対応していません";
    return;
  }
  try{
    adminToken = await login();
    showOnly(menuPanelEl);
  }catch(e){
    showOnly(loginPanelEl);
    if(e.message === "no_credentials"){
      showSetupArea();
    } else {
      loginErrorEl.textContent = passkeyErrorMessage(e);
    }
  }
}

async function trySetup(){
  setupErrorEl.textContent = "";
  if(!window.PublicKeyCredential){
    setupErrorEl.textContent = "このブラウザはパスキーに対応していません";
    return;
  }
  try{
    const data = await registerPasskey({ setupCode: setupInputEl.value });
    setupInputEl.value = "";
    adminToken = data.token;
    currentCredentialId = data.credentialId;
    setupAreaEl.classList.add("hidden");
    loginBtnEl.classList.remove("hidden");
    showOnly(menuPanelEl);
  }catch(e){
    setupErrorEl.textContent = e.message === "unauthorized" ? "セットアップコードが違います" : passkeyErrorMessage(e);
  }
}

function showSetupArea(){
  loginBtnEl.classList.add("hidden");
  setupAreaEl.classList.remove("hidden");
}

async function initLogin(){
  try{
    const options = await postAdmin({ action: "authOptions" });
    if(!options.hasCredentials){
      showSetupArea();
    }
  }catch(e){
    loginErrorEl.textContent = passkeyErrorMessage(e);
  }
}

function renderPasskeys(credentials){
  passkeyListEl.innerHTML = "";
  if(!credentials || credentials.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-text";
    empty.textContent = "登録されているパスキーがありません";
    passkeyListEl.appendChild(empty);
    return;
  }

  credentials.forEach(entry => {
    const row = document.createElement("div");
    row.className = "user-row";

    const info = document.createElement("div");
    info.className = "user-info";

    const name = document.createElement("div");
    name.className = "user-name";
    name.textContent = entry.id === currentCredentialId ? `${entry.label}（この端末）` : entry.label;

    const created = document.createElement("div");
    created.className = "user-sub";
    created.textContent = `登録日時: ${formatDateTime(entry.createdAt)}`;

    const used = document.createElement("div");
    used.className = "user-scores";
    used.textContent = `最終使用: ${formatDateTime(entry.lastUsedAt)}`;

    info.appendChild(name);
    info.appendChild(created);
    info.appendChild(used);

    const delBtn = document.createElement("button");
    delBtn.className = "user-delete-btn";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", async () => {
      const isCurrent = entry.id === currentCredentialId;
      const message = isCurrent
        ? `この端末のパスキー「${entry.label}」を削除しますか？次回からこの端末ではログインできなくなります`
        : `パスキー「${entry.label}」を削除しますか？`;
      if(!confirm(message)) return;
      showOnly(loadingPanelEl);
      try{
        const result = await callAdmin("deletePasskey", { id: entry.id });
        if(result.error === "last_credential"){
          alert("最後のパスキーは削除できません");
        } else if(result.error){
          alert("削除に失敗しました");
        }
        await loadPasskeyDashboard();
      }catch(e){
        handleSessionExpired();
      }
    });

    row.appendChild(info);
    row.appendChild(delBtn);
    passkeyListEl.appendChild(row);
  });
}

async function loadPasskeyDashboard(){
  showOnly(loadingPanelEl);
  try{
    const data = await callAdmin("listPasskeys", {});
    renderPasskeys(data.credentials);
    showOnly(passkeyDashboardEl);
  }catch(e){
    handleSessionExpired();
  }
}

function formatDuration(ms){
  const total = Math.max(0, Math.floor(ms / 1000));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const seconds = total % 60;
  if(hours > 0) return `${hours}時間${minutes}分`;
  if(minutes > 0) return `${minutes}分${seconds}秒`;
  return `${seconds}秒`;
}

function buildPresenceModeBoards(){
  presenceModeGridEl.innerHTML = "";
  MODES.forEach(mode => {
    const board = document.createElement("div");
    board.className = "board";

    const head = document.createElement("div");
    head.className = "board-head";

    const title = document.createElement("div");
    title.className = "board-title";
    title.textContent = MODE_LABELS[mode];

    const total = document.createElement("div");
    total.className = "presence-count zero";
    total.textContent = "0";
    presenceModeCountEls[mode] = total;

    head.appendChild(title);
    head.appendChild(total);
    board.appendChild(head);

    LEVELS.forEach(level => {
      const row = document.createElement("div");
      row.className = "score-row";

      const label = document.createElement("div");
      label.className = "score-name";
      label.textContent = LEVEL_LABELS[level];

      const count = document.createElement("div");
      count.className = "presence-count zero";
      count.textContent = "0";
      presenceModeCountEls[`${mode}:${level}`] = count;

      row.appendChild(label);
      row.appendChild(count);
      board.appendChild(row);
    });

    presenceModeGridEl.appendChild(board);
  });
}

function presenceSortKey(client){
  if(PLAYING_ACTIVITIES.includes(client.activity)) return 0;
  return client.activity === "matching" ? 1 : 2;
}

function updatePresenceDurations(){
  const elapsed = Date.now() - presenceReceivedAt;
  presenceDurationEls.forEach(item => {
    item.el.textContent = `接続時間: ${formatDuration(item.baseMs + elapsed)}`;
  });
}

function renderPresence(){
  const clients = presenceClients.slice().sort((a, b) => presenceSortKey(a) - presenceSortKey(b) || a.connectedMs - b.connectedMs);

  let playing = 0;
  let matching = 0;
  let idle = 0;
  const counts = {};
  clients.forEach(client => {
    if(PLAYING_ACTIVITIES.includes(client.activity)){
      playing++;
      if(client.mode){
        counts[client.mode] = (counts[client.mode] || 0) + 1;
        counts[`${client.mode}:${client.level}`] = (counts[`${client.mode}:${client.level}`] || 0) + 1;
      }
    } else if(client.activity === "matching"){
      matching++;
    } else {
      idle++;
    }
  });

  presenceTotalEl.textContent = clients.length;
  presencePlayingEl.textContent = playing;
  presenceMatchingEl.textContent = matching;
  presenceIdleEl.textContent = idle;

  Object.keys(presenceModeCountEls).forEach(key => {
    const count = counts[key] || 0;
    presenceModeCountEls[key].textContent = count;
    presenceModeCountEls[key].classList.toggle("zero", count === 0);
  });

  presenceListEl.innerHTML = "";
  presenceDurationEls = [];

  if(clients.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-text";
    empty.textContent = "現在サイトを開いているユーザーはいません";
    presenceListEl.appendChild(empty);
    return;
  }

  clients.forEach(client => {
    const row = document.createElement("div");
    row.className = client.page === "event" ? "user-row presence-row-event" : client.page === "school" ? "user-row presence-row-school" : "user-row";

    const info = document.createElement("div");
    info.className = "user-info";

    const nameRow = document.createElement("div");
    nameRow.className = "presence-name-row";

    const name = document.createElement("div");
    name.className = "user-name";
    name.textContent = client.name || "GUEST";

    const badge = document.createElement("span");
    const sortKey = presenceSortKey(client);
    badge.className = `presence-badge${sortKey === 0 ? " playing" : sortKey === 1 ? " matching" : ""}`;
    badge.textContent = ACTIVITY_LABELS[client.activity] || ACTIVITY_LABELS.idle;

    nameRow.appendChild(name);
    if(client.page === "event"){
      const pageBadge = document.createElement("span");
      pageBadge.className = "presence-badge event-page";
      pageBadge.textContent = "イベントページ";
      nameRow.appendChild(pageBadge);
    }
    if(client.page === "school"){
      const schoolBadge = document.createElement("span");
      schoolBadge.className = "presence-badge school-page";
      schoolBadge.textContent = "学校用ページ";
      nameRow.appendChild(schoolBadge);
    }
    nameRow.appendChild(badge);
    info.appendChild(nameRow);

    if(client.mode){
      const meta = document.createElement("div");
      meta.className = "user-sub";
      meta.textContent = `${MODE_LABELS[client.mode] || client.mode} / ${LEVEL_LABELS[client.level] || client.level}`;
      info.appendChild(meta);
    }

    const duration = document.createElement("div");
    duration.className = "user-scores";
    presenceDurationEls.push({ el: duration, baseMs: client.connectedMs });
    info.appendChild(duration);

    const network = document.createElement("div");
    network.className = "user-sub";
    network.textContent = `IP: ${client.ip || "unknown"}`;
    info.appendChild(network);

    const agent = document.createElement("div");
    agent.className = "user-sub";
    agent.textContent = `UA: ${client.userAgent || "unknown"}`;
    info.appendChild(agent);

    row.appendChild(info);
    presenceListEl.appendChild(row);
  });

  updatePresenceDurations();
}

function applyPresenceSnapshot(data){
  presenceClients = Array.isArray(data.clients) ? data.clients : [];
  presenceReceivedAt = Date.now();
  renderPresence();
}

function setPresenceStatus(connected){
  presenceStatusEl.classList.toggle("connected", connected);
  presenceStatusTextEl.textContent = connected ? "リアルタイム更新中" : "再接続中...";
}

function stopPresenceStream(){
  presenceSession++;
  clearTimeout(presenceReconnectTimer);
  clearInterval(presenceDurationTimer);
  presenceReconnectTimer = null;
  presenceDurationTimer = null;
  if(presenceSocket){
    const socket = presenceSocket;
    presenceSocket = null;
    socket.close();
  }
}

function schedulePresenceReconnect(session){
  const delay = Math.min(15000, 1000 * 2 ** presenceRetry);
  presenceRetry++;
  presenceReconnectTimer = setTimeout(async () => {
    if(session !== presenceSession) return;
    try{
      const data = await callAdmin("presenceSnapshot", {});
      if(session !== presenceSession) return;
      applyPresenceSnapshot(data);
      connectPresenceStream();
    }catch(e){
      if(session !== presenceSession) return;
      if(e.message === "unauthorized"){
        handleSessionExpired();
      } else {
        schedulePresenceReconnect(session);
      }
    }
  }, delay);
}

function connectPresenceStream(){
  const session = presenceSession;
  let socket;
  try{
    socket = new WebSocket(`${WORKER_URL.replace(/^http/, "ws")}/admin-presence`, ["admin-presence", adminToken]);
  }catch(e){
    setPresenceStatus(false);
    schedulePresenceReconnect(session);
    return;
  }
  presenceSocket = socket;
  socket.onopen = () => {
    if(session !== presenceSession) return;
    presenceRetry = 0;
    setPresenceStatus(true);
  };
  socket.onmessage = (event) => {
    if(session !== presenceSession) return;
    let data;
    try{
      data = JSON.parse(event.data);
    }catch(e){
      return;
    }
    if(data && data.type === "snapshot") applyPresenceSnapshot(data);
  };
  socket.onclose = () => {
    if(session !== presenceSession) return;
    if(presenceSocket === socket) presenceSocket = null;
    setPresenceStatus(false);
    schedulePresenceReconnect(session);
  };
}

function startPresenceStream(){
  stopPresenceStream();
  presenceRetry = 0;
  setPresenceStatus(false);
  presenceDurationTimer = setInterval(updatePresenceDurations, 1000);
  connectPresenceStream();
}

async function loadPresenceDashboard(){
  showOnly(loadingPanelEl);
  try{
    const data = await callAdmin("presenceSnapshot", {});
    if(!Array.isArray(data.clients)){
      alert("リアルタイム状況を取得できませんでした。サーバーのDurable Object設定（PRESENCE）を確認してください");
      showOnly(menuPanelEl);
      return;
    }
    applyPresenceSnapshot(data);
    showOnly(presenceDashboardEl);
    startPresenceStream();
  }catch(e){
    handleSessionExpired();
  }
}
