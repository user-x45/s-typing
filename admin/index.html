<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理者ページ｜シンプルタイピング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

  :root{
    --washi:#faf8f4;
    --washi-deep:#f0ece2;
    --ink:#2b2a2e;
    --ink-soft:#7a7680;
    --hanko:#e0563f;
    --hanko-deep:#c4432e;
    --gold:#dba52a;
    --line:#e5e0d5;
    --panel-bg:#ffffff;
    --panel-bg-soft:#f3efe6;
    --input-bg:#ffffff;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --washi:#1b1a1d;
      --washi-deep:#232226;
      --ink:#f0eee9;
      --ink-soft:#a29d97;
      --hanko:#e8724f;
      --hanko-deep:#f28762;
      --gold:#e0b545;
      --line:#333136;
      --panel-bg:#232226;
      --panel-bg-soft:#2b2a2e;
      --input-bg:#232226;
    }
  }

  *{box-sizing:border-box;}

  button, input, select, textarea{
    font-family: inherit;
  }

  html{height:100%;}

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--washi);
    color:var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Meiryo, "メイリオ", sans-serif;
    line-height:1.5;
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }

  .stage{
    width:100%;
    max-width:920px;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }

  .kicker{
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--gold);
    margin-bottom:6px;
  }

  h1{
    font-weight:800;
    font-size:30px;
    margin:0;
    letter-spacing:0.06em;
  }

  .panel{
    background:var(--panel-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px;
  }

  .login-panel{
    max-width:360px;
    margin:0 auto;
  }

  .field-label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  input[type="password"]{
    width:100%;
    padding:12px 14px;
    background:var(--input-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    color:var(--ink);
    outline:none;
  }

  input[type="password"]:focus{
    border-color:var(--gold);
  }

  .login-btn{
    width:100%;
    margin-top:16px;
    padding:12px;
    background:var(--hanko);
    color:var(--washi);
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }

  .login-btn:hover{
    background:var(--hanko-deep);
  }

  .login-btn:disabled{
    opacity:0.6;
    cursor:default;
  }

  .error-text{
    color:var(--hanko);
    font-size:13px;
    margin-top:10px;
    min-height:1em;
  }

  .hidden{display:none !important;}

  .loading-panel{
    max-width:360px;
    margin:0 auto;
    text-align:center;
  }

  .loading-text{
    font-size:15px;
    color:var(--ink-soft);
  }

  .spinner{
    width:32px;
    height:32px;
    margin:0 auto 16px;
    border:3px solid var(--line);
    border-top-color:var(--hanko);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }

  @keyframes spin{
    to{ transform:rotate(360deg); }
  }

  .menu-panel{
    max-width:420px;
    margin:0 auto;
  }

  .menu-grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .menu-btn{
    width:100%;
    padding:18px;
    background:var(--panel-bg-soft);
    border:1.5px solid var(--line);
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }

  .menu-btn:hover{
    border-color:var(--hanko);
    color:var(--hanko);
  }

  .logout-btn{
    width:100%;
    margin-top:6px;
    padding:12px;
    background:transparent;
    border:1.5px solid var(--hanko);
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    color:var(--hanko);
    cursor:pointer;
    text-align:center;
  }

  .logout-btn:hover{
    background:var(--hanko);
    color:var(--washi);
  }

  .board-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
  }

  .board{
    background:var(--panel-bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }

  .board-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  .board-title{
    font-weight:700;
    font-size:15px;
  }

  .clear-btn{
    background:transparent;
    border:1px solid var(--hanko);
    color:var(--hanko);
    border-radius:10px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
  }

  .clear-btn:hover{
    background:var(--hanko);
    color:var(--washi);
  }

  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 4px;
    border-bottom:1px solid rgba(0,0,0,0.06);
    font-size:13px;
  }

  .score-row:last-child{
    border-bottom:none;
  }

  .score-rank{
    font-weight:700;
    color:var(--hanko);
    width:40px;
  }

  .score-name{
    flex:1;
    padding-right:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .score-value{
    flex:1;
    font-weight:600;
  }

  .delete-btn{
    background:transparent;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:12px;
    padding:2px 6px;
  }

  .delete-btn:hover{
    color:var(--hanko);
  }

  .empty-text{
    font-size:13px;
    color:var(--ink-soft);
    opacity:0.7;
    padding:6px 4px;
  }

  .top-actions{
    display:flex;
    justify-content:space-between;
    margin-bottom:16px;
  }

  .refresh-btn, .back-btn{
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    border-radius:10px;
    padding:8px 18px;
    font-size:13px;
    cursor:pointer;
  }

  .refresh-btn:hover, .back-btn:hover{
    background:var(--ink);
    color:var(--washi);
  }

  .user-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .user-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
  }

  .user-info{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .user-name{
    font-weight:700;
    font-size:14px;
  }

  .user-sub{
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.7;
    word-break:break-all;
  }

  .user-scores{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .user-delete-btn{
    background:transparent;
    border:1px solid var(--hanko);
    color:var(--hanko);
    border-radius:10px;
    padding:6px 14px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
  }

  .user-delete-btn:hover{
    background:var(--hanko);
    color:var(--washi);
  }

  .event-status{
    font-size:14px;
    font-weight:700;
    margin-bottom:18px;
  }

  input[type="month"]{
    width:100%;
    box-sizing:border-box;
    padding:12px 14px;
    background:var(--input-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    color:var(--ink);
    outline:none;
    margin-bottom:14px;
    min-width:0;
  }

  input[type="month"]::-webkit-datetime-edit{
    max-width:100%;
    overflow:hidden;
  }

  input[type="month"]:focus{
    border-color:var(--gold);
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="kicker">SIMPLE TYPING</div>
    <h1>管理者ページ</h1>
  </header>

  <div class="panel login-panel" id="login-panel">
    <label class="field-label" for="password-input">管理者パスワード</label>
    <input type="password" id="password-input" autocomplete="off">
    <button class="login-btn" id="login-btn">ログイン</button>
    <div class="error-text" id="login-error"></div>
  </div>

  <div class="panel loading-panel hidden" id="loading-panel">
    <div class="spinner"></div>
    <div class="loading-text">読み込み中...</div>
  </div>

  <div class="panel menu-panel hidden" id="menu-panel">
    <div class="menu-grid">
      <button class="menu-btn" id="menu-ranking-btn">ランキング管理</button>
      <button class="menu-btn" id="menu-users-btn">ユーザー管理</button>
      <button class="menu-btn" id="menu-invite-btn">招待コード管理</button>
      <button class="menu-btn" id="menu-playlog-btn">プレイログ</button>
      <button class="menu-btn" id="menu-event-btn">イベントモード</button>
      <button class="logout-btn" id="logout-btn">ログアウト</button>
    </div>
  </div>

  <div id="ranking-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="ranking-back-btn">戻る</button>
      <button class="refresh-btn" id="refresh-btn">再読み込み</button>
    </div>
    <div class="board-grid" id="board-grid"></div>
  </div>

  <div id="user-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="user-back-btn">戻る</button>
      <button class="refresh-btn" id="user-refresh-btn">再読み込み</button>
    </div>
    <div class="user-list" id="user-list"></div>
  </div>

  <div id="invite-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="invite-back-btn">戻る</button>
      <button class="refresh-btn" id="invite-refresh-btn">再読み込み</button>
    </div>
    <div class="user-list" id="invite-list"></div>
  </div>

  <div id="playlog-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="playlog-back-btn">戻る</button>
      <div>
        <button class="clear-btn" id="playlog-clear-btn">全削除</button>
        <button class="refresh-btn" id="playlog-refresh-btn">再読み込み</button>
      </div>
    </div>
    <div class="user-list" id="playlog-list"></div>
  </div>

  <div id="event-dashboard" class="hidden">
    <div class="top-actions">
      <button class="back-btn" id="event-back-btn">戻る</button>
      <button class="refresh-btn" id="event-refresh-btn">再読み込み</button>
    </div>
    <div class="panel">
      <label class="field-label">イベントモード状態</label>
      <div class="event-status" id="event-status-text">読み込み中...</div>
      <label class="field-label" for="event-month-input">対象月</label>
      <input type="month" id="event-month-input">
      <button class="login-btn" id="event-enable-btn">この月でイベントモードを有効化</button>
      <button class="logout-btn" id="event-disable-btn">無効化</button>
    </div>
    <div class="panel" style="margin-top:16px;">
      <label class="field-label">月別ランキングの確認</label>
      <input type="month" id="event-archive-month-input">
      <button class="login-btn" id="event-archive-load-btn">月別ランキングを表示</button>
      <div class="board-grid" id="event-archive-grid" style="margin-top:16px;"></div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://key-onl.user-x45.workers.dev";
const MODE_LABELS = { hiragana: "ひらがな", katakana: "カタカナ", sentence: "文章" };
const LEVEL_LABELS = { beginner: "初級", intermediate: "中級", advanced: "上級" };
const MATCH_TYPE_LABELS = { solo: "一人プレイ", online: "オンライン対戦", friend: "フレンド対戦" };
const MODES = ["hiragana", "katakana", "sentence"];
const LEVELS = ["beginner", "intermediate", "advanced"];

let adminToken = "";

const loginPanelEl = document.getElementById("login-panel");
const loadingPanelEl = document.getElementById("loading-panel");
const menuPanelEl = document.getElementById("menu-panel");
const rankingDashboardEl = document.getElementById("ranking-dashboard");
const userDashboardEl = document.getElementById("user-dashboard");
const inviteDashboardEl = document.getElementById("invite-dashboard");
const playlogDashboardEl = document.getElementById("playlog-dashboard");
const passwordInputEl = document.getElementById("password-input");
const loginBtnEl = document.getElementById("login-btn");
const loginErrorEl = document.getElementById("login-error");
const refreshBtnEl = document.getElementById("refresh-btn");
const boardGridEl = document.getElementById("board-grid");
const userListEl = document.getElementById("user-list");
const inviteListEl = document.getElementById("invite-list");
const menuRankingBtnEl = document.getElementById("menu-ranking-btn");
const menuUsersBtnEl = document.getElementById("menu-users-btn");
const menuInviteBtnEl = document.getElementById("menu-invite-btn");
const logoutBtnEl = document.getElementById("logout-btn");
const rankingBackBtnEl = document.getElementById("ranking-back-btn");
const userBackBtnEl = document.getElementById("user-back-btn");
const userRefreshBtnEl = document.getElementById("user-refresh-btn");
const inviteBackBtnEl = document.getElementById("invite-back-btn");
const inviteRefreshBtnEl = document.getElementById("invite-refresh-btn");
const menuPlaylogBtnEl = document.getElementById("menu-playlog-btn");
const playlogListEl = document.getElementById("playlog-list");
const playlogBackBtnEl = document.getElementById("playlog-back-btn");
const playlogRefreshBtnEl = document.getElementById("playlog-refresh-btn");
const playlogClearBtnEl = document.getElementById("playlog-clear-btn");
const eventDashboardEl = document.getElementById("event-dashboard");
const menuEventBtnEl = document.getElementById("menu-event-btn");
const eventBackBtnEl = document.getElementById("event-back-btn");
const eventRefreshBtnEl = document.getElementById("event-refresh-btn");
const eventStatusTextEl = document.getElementById("event-status-text");
const eventMonthInputEl = document.getElementById("event-month-input");
const eventEnableBtnEl = document.getElementById("event-enable-btn");
const eventDisableBtnEl = document.getElementById("event-disable-btn");
const eventArchiveMonthInputEl = document.getElementById("event-archive-month-input");
const eventArchiveLoadBtnEl = document.getElementById("event-archive-load-btn");
const eventArchiveGridEl = document.getElementById("event-archive-grid");

function showOnly(el){
  [loginPanelEl, loadingPanelEl, menuPanelEl, rankingDashboardEl, userDashboardEl, inviteDashboardEl, playlogDashboardEl, eventDashboardEl].forEach(node => {
    if(node === el){
      node.classList.remove("hidden");
    } else {
      node.classList.add("hidden");
    }
  });
}

async function callAdmin(action, extra){
  const res = await fetch(`${WORKER_URL}/admin`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: adminToken, action, ...extra })
  });
  if(res.status === 401){
    throw new Error("unauthorized");
  }
  return res.json();
}

async function login(password){
  const res = await fetch(`${WORKER_URL}/admin`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "login", password })
  });
  if(res.status === 429){
    const data = await res.json();
    const err = new Error("locked");
    err.retryAfterSeconds = data.retryAfterSeconds;
    throw err;
  }
  if(!res.ok){
    throw new Error("unauthorized");
  }
  const data = await res.json();
  return data.token;
}

function renderBoards(data){
  boardGridEl.innerHTML = "";
  for(const mode of MODES){
    for(const level of LEVELS){
      const key = `${mode}:${level}`;
      const scores = data[key] || [];
      const board = document.createElement("div");
      board.className = "board";

      const head = document.createElement("div");
      head.className = "board-head";

      const title = document.createElement("div");
      title.className = "board-title";
      title.textContent = `${MODE_LABELS[mode]}・${LEVEL_LABELS[level]}`;

      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-btn";
      clearBtn.textContent = "全削除";
      clearBtn.addEventListener("click", async () => {
        if(!confirm(`${MODE_LABELS[mode]}・${LEVEL_LABELS[level]} のランキングを全て削除しますか？`)) return;
        showOnly(loadingPanelEl);
        try{
          await callAdmin("clear", { mode, level });
          await loadRankingDashboard();
        }catch(e){
          handleSessionExpired();
        }
      });

      head.appendChild(title);
      head.appendChild(clearBtn);
      board.appendChild(head);

      if(scores.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty-text";
        empty.textContent = "データがありません";
        board.appendChild(empty);
      } else {
        scores.forEach((entry, i) => {
          const scoreValue = typeof entry === "object" && entry !== null ? entry.score : entry;
          const scoreName = typeof entry === "object" && entry !== null && entry.name ? entry.name : "GUEST";

          const row = document.createElement("div");
          row.className = "score-row";

          const rank = document.createElement("div");
          rank.className = "score-rank";
          rank.textContent = `${i + 1}位`;

          const name = document.createElement("div");
          name.className = "score-name";
          name.textContent = scoreName;

          const value = document.createElement("div");
          value.className = "score-value";
          value.textContent = scoreValue;

          const del = document.createElement("button");
          del.className = "delete-btn";
          del.textContent = "削除";
          del.addEventListener("click", async () => {
            if(!confirm(`${scoreName}（${scoreValue}）を削除しますか？`)) return;
            showOnly(loadingPanelEl);
            try{
              await callAdmin("delete", { mode, level, score: scoreValue });
              await loadRankingDashboard();
            }catch(e){
              handleSessionExpired();
            }
          });

          row.appendChild(rank);
          row.appendChild(name);
          row.appendChild(value);
          row.appendChild(del);
          board.appendChild(row);
        });
      }

      boardGridEl.appendChild(board);
    }
  }
}

function renderUsers(users){
  userListEl.innerHTML = "";
  if(!users || users.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-text";
    empty.textContent = "登録されているユーザーがいません";
    userListEl.appendChild(empty);
    return;
  }

  users.forEach(user => {
    const row = document.createElement("div");
    row.className = "user-row";

    const info = document.createElement("div");
    info.className = "user-info";

    const name = document.createElement("div");
    name.className = "user-name";
    name.textContent = user.name || "GUEST";

    const sub = document.createElement("div");
    sub.className = "user-sub";
    sub.textContent = user.sub;

    const scoreKeys = Object.keys(user.highScores || {});
    const scores = document.createElement("div");
    scores.className = "user-scores";
    scores.textContent = scoreKeys.length > 0
      ? scoreKeys.map(k => `${k}: ${user.highScores[k]}`).join(" / ")
      : "ハイスコアなし";

    info.appendChild(name);
    info.appendChild(sub);
    info.appendChild(scores);

    const delBtn = document.createElement("button");
    delBtn.className = "user-delete-btn";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", async () => {
      if(!confirm(`ユーザー「${user.name || "GUEST"}」を削除しますか？この操作は取り消せません`)) return;
      showOnly(loadingPanelEl);
      try{
        await callAdmin("deleteUser", { sub: user.sub });
        await loadUserDashboard();
      }catch(e){
        handleSessionExpired();
      }
    });

    row.appendChild(info);
    row.appendChild(delBtn);
    userListEl.appendChild(row);
  });
}

function renderInviteCodes(codes){
  inviteListEl.innerHTML = "";
  if(!codes || codes.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-text";
    empty.textContent = "有効な招待コードがありません";
    inviteListEl.appendChild(empty);
    return;
  }

  codes.forEach(entry => {
    const row = document.createElement("div");
    row.className = "user-row";

    const info = document.createElement("div");
    info.className = "user-info";

    const code = document.createElement("div");
    code.className = "user-name";
    code.textContent = entry.code;

    const meta = document.createElement("div");
    meta.className = "user-sub";
    meta.textContent = `${MODE_LABELS[entry.mode] || entry.mode} / ${LEVEL_LABELS[entry.level] || entry.level}`;

    const expires = document.createElement("div");
    expires.className = "user-scores";
    expires.textContent = `有効期限: ${new Date(entry.expiresAt).toLocaleString("ja-JP")}`;

    info.appendChild(code);
    info.appendChild(meta);
    info.appendChild(expires);

    const delBtn = document.createElement("button");
    delBtn.className = "user-delete-btn";
    delBtn.textContent = "削除";
    delBtn.addEventListener("click", async () => {
      if(!confirm(`招待コード「${entry.code}」を削除しますか？`)) return;
      showOnly(loadingPanelEl);
      try{
        await callAdmin("deleteInviteCode", { code: entry.code });
        await loadInviteDashboard();
      }catch(e){
        handleSessionExpired();
      }
    });

    row.appendChild(info);
    row.appendChild(delBtn);
    inviteListEl.appendChild(row);
  });
}

function renderPlayLog(entries){
  playlogListEl.innerHTML = "";
  if(!entries || entries.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-text";
    empty.textContent = "プレイ履歴がありません";
    playlogListEl.appendChild(empty);
    return;
  }

  entries.forEach(entry => {
    const row = document.createElement("div");
    row.className = "user-row";

    const info = document.createElement("div");
    info.className = "user-info";

    const name = document.createElement("div");
    name.className = "user-name";
    name.textContent = entry.name || "GUEST";

    const meta = document.createElement("div");
    meta.className = "user-sub";
    meta.textContent = `${MODE_LABELS[entry.mode] || entry.mode} / ${LEVEL_LABELS[entry.level] || entry.level}`;

    const matchInfo = document.createElement("div");
    matchInfo.className = "user-sub";
    const matchTypeLabel = MATCH_TYPE_LABELS[entry.matchType] || MATCH_TYPE_LABELS.solo;
    matchInfo.textContent = entry.opponent ? `${matchTypeLabel} vs ${entry.opponent}` : matchTypeLabel;

    const time = document.createElement("div");
    time.className = "user-scores";
    time.textContent = new Date(entry.ts).toLocaleString("ja-JP");

    const network = document.createElement("div");
    network.className = "user-sub";
    network.textContent = `IP: ${entry.ip || "unknown"}`;

    const agent = document.createElement("div");
    agent.className = "user-sub";
    agent.textContent = `UA: ${entry.userAgent || "unknown"}`;

    info.appendChild(name);
    info.appendChild(meta);
    info.appendChild(matchInfo);
    info.appendChild(time);
    info.appendChild(network);
    info.appendChild(agent);

    row.appendChild(info);
    playlogListEl.appendChild(row);
  });
}

function renderArchiveBoards(data, month){
  eventArchiveGridEl.innerHTML = "";
  for(const mode of MODES){
    for(const level of LEVELS){
      const key = `${mode}:${level}`;
      const scores = data[key] || [];
      const board = document.createElement("div");
      board.className = "board";

      const head = document.createElement("div");
      head.className = "board-head";

      const title = document.createElement("div");
      title.className = "board-title";
      title.textContent = `${MODE_LABELS[mode]}・${LEVEL_LABELS[level]}`;

      const clearBtn = document.createElement("button");
      clearBtn.className = "clear-btn";
      clearBtn.textContent = "全削除";
      clearBtn.addEventListener("click", async () => {
        if(!confirm(`${MODE_LABELS[mode]}・${LEVEL_LABELS[level]} の ${month} のランキングを全て削除しますか？`)) return;
        showOnly(loadingPanelEl);
        try{
          await callAdmin("clearMonthRanking", { mode, level, month });
          const refreshed = await callAdmin("getEventArchive", { month });
          renderArchiveBoards(refreshed, month);
          showOnly(eventDashboardEl);
        }catch(e){
          handleSessionExpired();
        }
      });

      head.appendChild(title);
      head.appendChild(clearBtn);
      board.appendChild(head);

      if(scores.length === 0){
        const empty = document.createElement("div");
        empty.className = "empty-text";
        empty.textContent = "データがありません";
        board.appendChild(empty);
      } else {
        scores.forEach((entry, i) => {
          const scoreValue = typeof entry === "object" && entry !== null ? entry.score : entry;
          const scoreName = typeof entry === "object" && entry !== null && entry.name ? entry.name : "GUEST";

          const row = document.createElement("div");
          row.className = "score-row";

          const rank = document.createElement("div");
          rank.className = "score-rank";
          rank.textContent = `${i + 1}位`;

          const name = document.createElement("div");
          name.className = "score-name";
          name.textContent = scoreName;

          const value = document.createElement("div");
          value.className = "score-value";
          value.textContent = scoreValue;

          const del = document.createElement("button");
          del.className = "delete-btn";
          del.textContent = "削除";
          del.addEventListener("click", async () => {
            if(!confirm(`${scoreName}（${scoreValue}）を削除しますか？`)) return;
            showOnly(loadingPanelEl);
            try{
              await callAdmin("deleteMonthRanking", { mode, level, month, score: scoreValue });
              const refreshed = await callAdmin("getEventArchive", { month });
              renderArchiveBoards(refreshed, month);
              showOnly(eventDashboardEl);
            }catch(e){
              handleSessionExpired();
            }
          });

          row.appendChild(rank);
          row.appendChild(name);
          row.appendChild(value);
          row.appendChild(del);
          board.appendChild(row);
        });
      }

      eventArchiveGridEl.appendChild(board);
    }
  }
}

async function loadEventDashboard(){
  showOnly(loadingPanelEl);
  try{
    const data = await callAdmin("getEventMode", {});
    eventStatusTextEl.textContent = data.enabled
      ? `イベントモード: 有効中（対象月: ${data.month || "未設定"}）`
      : "イベントモード: 無効";
    eventMonthInputEl.value = data.month || "";
    eventArchiveGridEl.innerHTML = "";
    showOnly(eventDashboardEl);
  }catch(e){
    handleSessionExpired();
  }
}

eventArchiveLoadBtnEl.addEventListener("click", async () => {

function handleSessionExpired(){
  adminToken = "";
  showOnly(loginPanelEl);
  loginErrorEl.textContent = "セッションが切れました。もう一度パスワードを入力してください";
}

async function tryLogin(){
  loginErrorEl.textContent = "";
  showOnly(loadingPanelEl);
  try{
    adminToken = await login(passwordInputEl.value);
    passwordInputEl.value = "";
    showOnly(menuPanelEl);
  }catch(e){
    showOnly(loginPanelEl);
    if(e.message === "locked"){
      const minutes = Math.ceil(e.retryAfterSeconds / 60);
      loginErrorEl.textContent = `試行回数が多すぎます。${minutes}分後にもう一度お試しください`;
    } else {
      loginErrorEl.textContent = "パスワードが違います";
    }
  }
}

loginBtnEl.addEventListener("click", tryLogin);
passwordInputEl.addEventListener("keydown", (e) => {
  if(e.key === "Enter") tryLogin();
});

menuRankingBtnEl.addEventListener("click", loadRankingDashboard);
menuUsersBtnEl.addEventListener("click", loadUserDashboard);
menuInviteBtnEl.addEventListener("click", loadInviteDashboard);
menuPlaylogBtnEl.addEventListener("click", loadPlayLogDashboard);

logoutBtnEl.addEventListener("click", () => {
  adminToken = "";
  passwordInputEl.value = "";
  loginErrorEl.textContent = "";
  showOnly(loginPanelEl);
});

rankingBackBtnEl.addEventListener("click", () => showOnly(menuPanelEl));
userBackBtnEl.addEventListener("click", () => showOnly(menuPanelEl));

    await callAdmin("clearPlayLog", {});
    await loadPlayLogDashboard();

});
