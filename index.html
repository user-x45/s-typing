<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語タイピング練習</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
.ascii {
  font-family: monospace;
  white-space: pre;
  font-size: 12px;
  line-height: 1.2;
  color: #00ffcc;
  margin-bottom: 20px;
  text-align: center;
}
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  background: #16213e;
  color: #00ffcc;
  border: 2px solid #00ffcc;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
}
button:hover {
  background: #00ffcc;
  color: #1a1a2e;
}
button.active {
  background: #00ffcc;
  color: #1a1a2e;
  font-weight: bold;
}
#displayArea {
  width: 100%;
  max-width: 800px;
  background: #0f3460;
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  min-height: 180px;
}
.word-block {
  display: inline-block;
  margin: 0 8px 16px 0;
  text-align: center;
  vertical-align: top;
}
.word-kana {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 2px;
}
.word-hira {
  font-size: 13px;
  margin-top: 4px;
  letter-spacing: 1px;
  white-space: nowrap;
}
.word-hira .typed {
  color: #00ffcc;
}
.word-hira .untyped {
  color: #888;
}
.romaji-display {
  font-size: 14px;
  color: #aaa;
  margin-top: 6px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#inputArea {
  width: 100%;
  max-width: 800px;
  margin-bottom: 16px;
}
#romajiInput {
  width: 100%;
  padding: 14px;
  font-size: 20px;
  border: 2px solid #00ffcc;
  border-radius: 8px;
  background: #16213e;
  color: #fff;
  outline: none;
}
#romajiInput:focus {
  border-color: #00ffaa;
  box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
}
#realtimeRomaji {
  margin-top: 8px;
  font-size: 16px;
  color: #00ffcc;
  min-height: 24px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  word-break: break-all;
}
.hidden {
  display: none !important;
}
#stats {
  font-size: 14px;
  color: #aaa;
  margin-top: 12px;
}
.mode-label {
  font-size: 14px;
  color: #888;
  margin-bottom: 8px;
}
</style>
</head>
<body>
<div class="ascii">
  ╔══════════════════════════════════════╗
  ║   日 本 語 タ イ ピ ン グ 練 習      ║
  ╚══════════════════════════════════════╝
</div>

<div class="controls">
  <button id="btnRealtime" class="active">リアルタイム</button>
  <button id="btnTextbox">テキストボックス</button>
</div>

<div id="displayArea">
  <div class="mode-label">文章モード</div>
  <div id="sentenceDisplay"></div>
</div>

<div id="inputArea">
  <input type="text" id="romajiInput" placeholder="ローマ字を入力..." autocomplete="off" spellcheck="false">
  <div id="realtimeRomaji"></div>
</div>

<div id="stats">進捗: <span id="progress">0</span> / <span id="total">0</span></div>

<script>
const sentences = [
  { kana: "こんにちは", hira: "こんにちは", romaji: "konnichiha" },
  { kana: "ありがとう", hira: "ありがとう", romaji: "arigatou" },
  { kana: "おはようございます", hira: "おはようございます", romaji: "ohayougozaimasu" },
  { kana: "すみません", hira: "すみません", romaji: "sumimasen" },
  { kana: "いただきます", hira: "いただきます", romaji: "itadakimasu" },
  { kana: "さようなら", hira: "さようなら", romaji: "sayounara" },
  { kana: "がんばって", hira: "がんばって", romaji: "ganbatte" },
  { kana: "おめでとうございます", hira: "おめでとうございます", romaji: "omedetougozaimasu" }
];

let currentIndex = 0;
let typedRomaji = "";
let mode = "realtime";
let currentSentence = null;

const btnRealtime = document.getElementById("btnRealtime");
const btnTextbox = document.getElementById("btnTextbox");
const romajiInput = document.getElementById("romajiInput");
const realtimeRomaji = document.getElementById("realtimeRomaji");
const sentenceDisplay = document.getElementById("sentenceDisplay");
const progressEl = document.getElementById("progress");
const totalEl = document.getElementById("total");

function init() {
  totalEl.textContent = sentences.length;
  loadSentence();
  updateUI();
}

function loadSentence() {
  if (currentIndex >= sentences.length) {
    currentIndex = 0;
  }
  currentSentence = sentences[currentIndex];
  typedRomaji = "";
  romajiInput.value = "";
  renderSentence();
  updateProgress();
}

function renderSentence() {
  const word = currentSentence;
  const hira = word.hira;
  const typedLen = getMatchedHiraLength(typedRomaji, word.romaji, hira);

  let hiraHtml = "";
  for (let i = 0; i < hira.length; i++) {
    if (i < typedLen) {
      hiraHtml += `<span class="typed">${hira[i]}</span>`;
    } else {
      hiraHtml += `<span class="untyped">${hira[i]}</span>`;
    }
  }

  sentenceDisplay.innerHTML = `
    <div class="word-block">
      <div class="word-kana">${word.kana}</div>
      <div class="word-hira">${hiraHtml}</div>
      <div class="romaji-display">${word.romaji}</div>
    </div>
  `;
}

function getMatchedHiraLength(typed, targetRomaji, hira) {
  let matched = 0;
  let romajiPos = 0;
  const lowerTyped = typed.toLowerCase();
  const lowerTarget = targetRomaji.toLowerCase();

  for (let i = 0; i < hira.length; i++) {
    const char = hira[i];
    let needed = 1;
    if ("きゃきゅきょしゃしゅしょちゃちゅちょにゃにゅにょひゃひゅひょみゃみゅみょりゃりゅりょぎゃぎゅぎょじゃじゅじょびゃびゅびょぴゃぴゅぴょ".includes(char)) {
      needed = 3;
    } else if ("っん".includes(char)) {
      needed = char === "っ" ? 1 : 1;
    } else {
      needed = 1;
    }

    let slice = lowerTarget.slice(romajiPos, romajiPos + needed + 2);
    let found = false;
    for (let len = 1; len <= 4; len++) {
      const candidate = lowerTarget.slice(romajiPos, romajiPos + len);
      if (lowerTyped.startsWith(candidate) || lowerTyped.length >= romajiPos + len && lowerTyped.slice(0, romajiPos + len) === lowerTarget.slice(0, romajiPos + len)) {
        if (lowerTyped.length >= romajiPos + len) {
          romajiPos += len;
          matched = i + 1;
          found = true;
          break;
        }
      }
    }
    if (!found) break;
    if (romajiPos >= lowerTyped.length) break;
  }

  let exact = 0;
  for (let i = 0; i <= lowerTarget.length; i++) {
    if (lowerTyped.startsWith(lowerTarget.slice(0, i))) {
      exact = i;
    }
  }
  const ratio = exact / lowerTarget.length;
  return Math.floor(ratio * hira.length);
}

function updateProgress() {
  progressEl.textContent = currentIndex;
}

function updateUI() {
  if (mode === "realtime") {
    btnRealtime.classList.add("active");
    btnTextbox.classList.remove("active");
    realtimeRomaji.classList.remove("hidden");
  } else {
    btnRealtime.classList.remove("active");
    btnTextbox.classList.add("active");
    realtimeRomaji.classList.add("hidden");
  }
}

btnRealtime.addEventListener("click", () => {
  mode = "realtime";
  updateUI();
  romajiInput.focus();
});

btnTextbox.addEventListener("click", () => {
  mode = "textbox";
  updateUI();
  romajiInput.focus();
});

romajiInput.addEventListener("input", (e) => {
  typedRomaji = e.target.value;
  if (mode === "realtime") {
    realtimeRomaji.textContent = typedRomaji;
    realtimeRomaji.style.overflow = "hidden";
    realtimeRomaji.style.textOverflow = "ellipsis";
    realtimeRomaji.style.whiteSpace = "nowrap";
  }
  renderSentence();

  const target = currentSentence.romaji.toLowerCase();
  if (typedRomaji.toLowerCase() === target) {
    currentIndex++;
    setTimeout(() => {
      loadSentence();
      romajiInput.focus();
    }, 300);
  }
});

romajiInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && mode === "textbox") {
    const target = currentSentence.romaji.toLowerCase();
    if (typedRomaji.toLowerCase() === target) {
      currentIndex++;
      loadSentence();
    }
  }
});

init();
romajiInput.focus();
</script>
</body>
</html>
